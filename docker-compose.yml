# docker-compose.yml - Complete QECopilot Stack

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: qube-postgres
    environment:
      POSTGRES_USER: qubeai
      POSTGRES_PASSWORD: qubeai_secure_2024
      POSTGRES_DB: qubeai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qubeai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qube-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: qube-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qube-network

  # ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:latest
    container_name: qube-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "False"
      ALLOW_RESET: "True"
      IS_PERSISTENT: "True"
    networks:
      - qube-network

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: qube-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./backend/scripts/pull_models.sh:/scripts/pull_models.sh
    environment:
      OLLAMA_HOST: 0.0.0.0
    deploy:
      resources:
        limits:
          memory: 8G
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "ollama serve &
       sleep 5 &&
       sh /scripts/pull_models.sh &&
       tail -f /dev/null"
    networks:
      - qube-network

  # QECopilot Backend Service
  qe-copilot-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qube-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      # Database
      DATABASE_URL: postgresql://qubeai:qubeai_secure_2024@postgres:5432/qubeai
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # Vector Store
      VECTOR_DB_TYPE: chromadb
      VECTOR_DB_URL: http://chromadb:8000
      
      # Default LLM (Ollama)
      LLM_PROVIDER: ollama
      LLM_MODEL: llama2
      LLM_BASE_URL: http://ollama:11434
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this-in-production}
      
      # CORS
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      
      # Logging
      LOG_LEVEL: INFO
      
      # Application
      ENVIRONMENT: development
      WORKERS: 4
    volumes:
      - ./backend/services:/app
      - ./workspace:/workspace
      - backend_logs:/app/logs
    networks:
      - qube-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  qe-copilot-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qube-frontend
    ports:
      - "3000:3000"
    depends_on:
      - qe-copilot-backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - qube-network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: qube-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - qe-copilot-backend
      - qe-copilot-frontend
    networks:
      - qube-network
    profiles:
      - production

  # PgAdmin for Database Management (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qube-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qubeai.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - qube-network
    profiles:
      - tools

networks:
  qube-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  backend_logs:
  pgadmin_data: